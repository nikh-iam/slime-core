    <mask
      id="slime-face-mask"
      maskUnits="userSpaceOnUse"
      x="-125"
      y="-125"
      width="250"
      height="250"
    >
      <use href="#slime-shape" fill="#ffffff" />

      <rect
        class="eye-hole"
        x="-45"
        y="-22"
        width="31"
        height="51"
        rx="15.5"
        fill="#000000"
      />

      <rect
        class="eye-hole"
        x="18"
        y="-22"
        width="31"
        height="51"
        rx="15.5"
        fill="#000000"
      />
    </mask>

    <filter
      id="character-shadow"
      x="-100%"
      y="-100%"
      width="300%"
      height="300%"
    >
      <feGaussianBlur stdDeviation="7" />
    </filter>
