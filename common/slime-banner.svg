  <style><![CDATA[
    .slime-character {
      transform-box: fill-box;
      transform-origin: center;
      animation:
        characterReveal .9s cubic-bezier(.22,.8,.25,1) both,
        slimeFloat 5.2s 1s ease-in-out infinite;
    }

    .slime-body {
      transform-box: fill-box;
      transform-origin: center;
      animation: slimeBreathe 4.8s ease-in-out infinite;
    }

    .slime-shadow {
      transform-box: fill-box;
      transform-origin: center;
      animation: shadowBreathe 4.8s ease-in-out infinite;
    }

    .eye-hole {
      transform-box: fill-box;
      transform-origin: center;
      animation:
        eyeLook 5.6s ease-in-out infinite,
        eyeBlink 5.2s 1.2s ease-in-out infinite;
    }

    .brand {
      opacity: 0;
      animation: reveal .9s .25s cubic-bezier(.22,.8,.25,1) forwards;
    }

    .beta {
      opacity: 0;
      animation: reveal .8s .5s cubic-bezier(.22,.8,.25,1) forwards;
    }

    .i-dot {
      transform-box: fill-box;
      transform-origin: center;
      animation: dotPulse 3.2s 1.2s ease-in-out infinite;
    }

    @keyframes characterReveal {
      from { opacity: 0; transform: translateY(10px) scale(.94); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes slimeFloat {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-4px); }
    }

    @keyframes slimeBreathe {
      0%, 100% { transform: scale(1); }
      50%      { transform: scale(1.016, .984); }
    }

    @keyframes shadowBreathe {
      0%, 100% { opacity: .11; transform: scaleX(1); }
      50%      { opacity: .065; transform: scaleX(.88); }
    }

    @keyframes eyeLook {
      0%, 18%   { transform: translate(0, 0); }
      28%, 42%  { transform: translate(-3px, 1px); }
      52%, 67%  { transform: translate(3px, -1px); }
      78%, 100% { transform: translate(0, 0); }
    }

    @keyframes eyeBlink {
      0%, 44%, 48%, 100% { scale: 1 1; }
      46%                { scale: 1 .08; }
    }

    @keyframes reveal {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes dotPulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50%      { transform: scale(.78); opacity: .72; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .brand, .beta, .slime-character { opacity: 1; }
    }
  ]]></style>

  <!-- SLIME CHARACTER
       Outer <g> = position, inner <g> = animation. -->
  <g transform="translate(467 160)">
    <g class="slime-character">
      <ellipse
        class="slime-shadow"
        cx="0"
        cy="96"
        rx="47"
        ry="7"
        fill="#000000"
        opacity=".11"
        filter="url(#character-shadow)"
      />

      <g transform="scale(.82)">
        <g class="slime-body">
          <use href="#slime-shape" fill="#F9F9F9" />

          <rect
            x="-125"
            y="-125"
            width="250"
            height="250"
            fill="#0A0A0C"
            mask="url(#slime-face-mask)"
          />
        </g>
      </g>
    </g>
  </g>

  <!-- WORDMARK -->
  <g
    class="brand"
    font-family="Inter, SF Pro Display, Segoe UI, Helvetica Neue, Arial, sans-serif"
    font-size="92"
    font-weight="700"
    letter-spacing="-5"
    fill="#111111"
  >
    <text x="647" y="176" text-anchor="end">Sl</text>

    <!-- i stem (matches x-height of "me") -->
    <rect x="655" y="130" width="12" height="46" rx="2" />

    <!-- Orange i dot: diameter = stem width, 10px gap above stem -->
    <circle class="i-dot" cx="661" cy="118" r="6" fill="#F58A1F" />

    <text x="669" y="176">me</text>
  </g>

  <!-- BETA LABEL (dot's left edge aligned with the S) -->
  <g transform="translate(590 195)">
    <g
      class="beta"
      font-family="Inter, SF Pro Display, Segoe UI, Helvetica Neue, Arial, sans-serif"
    >
      <circle cx="3.5" cy="5" r="3.5" fill="#F58A1F" />

      <text
        x="17"
        y="10"
        font-size="14"
        font-weight="500"
        letter-spacing="1.5"
        fill="#777777"
      >BETA v0.1 - CORE.SLIME</text>
    </g>
  </g>
</svg>